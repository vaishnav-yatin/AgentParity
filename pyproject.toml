[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentparity"
version = "0.1.1"
description = "Connect agents across frameworks over A2A, and prove the connection is faithful."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Leap AI Technologies, Inc." }]
keywords = ["agents", "a2a", "mcp", "interoperability", "conformance", "langgraph", "crewai", "adk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
a2a = ["a2a-sdk[http-server]>=1.0,<2", "httpx>=0.27"]
langgraph = ["langgraph>=1.0"]
adk = ["google-adk>=2.0"]
openai-agents = ["openai-agents>=0.20"]
claude = ["claude-agent-sdk>=0.2"]
crewai = ["crewai>=1.10"]
agent-framework = ["agent-framework-core>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "uvicorn>=0.30"]

[project.scripts]
agentparity = "agentparity.cli:main"

[project.urls]
Repository = "https://github.com/vaishnav-yatin/AgentParity"
Issues = "https://github.com/vaishnav-yatin/AgentParity/issues"
Changelog = "https://github.com/vaishnav-yatin/AgentParity/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentparity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs a real model endpoint and credentials (opt-in)"]
